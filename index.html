<style>
  :root {
    --ink: #201D1A;
    --ink-soft: #6B6560;
    --paper: #F7F5F2;
    --paper-raised: #FFFFFF;
    --charcoal: #201D1A;
    --charcoal-deep: #0E0D0C;
    --gold: #B7924F;
    --gold-soft: #D8BD86;
    --line: rgba(32,29,26,0.12);
    --shadow: rgba(32,29,26,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EFEBE5;
      --ink-soft: #B9B2A9;
      --paper: #141210;
      --paper-raised: #211E1A;
      --charcoal: #EFEBE5;
      --charcoal-deep: #FFFFFF;
      --gold: #D8BD86;
      --gold-soft: #E9D5A8;
      --line: rgba(239,235,229,0.14);
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --ink: #EFEBE5;
    --ink-soft: #B9B2A9;
    --paper: #141210;
    --paper-raised: #211E1A;
    --charcoal: #EFEBE5;
    --charcoal-deep: #FFFFFF;
    --gold: #D8BD86;
    --gold-soft: #E9D5A8;
    --line: rgba(239,235,229,0.14);
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
  a { color: inherit; }

  /* ---------- Guest hero ---------- */
  .hero {
    text-align: center;
    padding: 34px 10px 26px;
  }
  .hero h1 {
    font-size: clamp(30px, 7vw, 44px);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .hero .sub {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .countdown {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .countdown .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    flex: none;
  }
  .countdown strong { color: var(--ink); font-weight: 600; }

  .brand-logo {
    width: 92px;
    height: auto;
    margin: 0 auto 14px;
    display: block;
    border-radius: 6px;
  }
  .brand-footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }
  .brand-footer strong { color: var(--ink); font-weight: 600; }

  /* ---------- Gallery ---------- */
  .gallery {
    margin-top: 30px;
    column-count: 2;
    column-gap: 10px;
  }
  @media (min-width: 560px) { .gallery { column-count: 3; } }
  .gallery img {
    width: 100%;
    display: block;
    margin-bottom: 10px;
    border-radius: 6px;
    break-inside: avoid;
    cursor: zoom-in;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: 12px;
    margin-top: 24px;
    font-size: 14.5px;
  }

  /* ---------- Follow CTA ---------- */
  .follow-bar {
    position: sticky;
    bottom: 14px;
    margin-top: 34px;
    display: flex;
    justify-content: center;
  }
  .follow-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--charcoal-deep), var(--gold));
    color: #FBF6EC;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 20px var(--shadow);
  }
  .follow-btn svg { width: 19px; height: 19px; flex: none; }

  /* ---------- Expired ---------- */
  .expired {
    text-align: center;
    padding: 70px 16px;
  }
  .expired h1 { font-size: 28px; }
  .expired p { color: var(--ink-soft); margin-top: 10px; font-size: 14.5px; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10,8,7,0.92);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 4px; }

  /* ---------- Admin ---------- */
  .admin-toggle {
    position: fixed; top: 14px; right: 14px;
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    background: var(--paper-raised);
    cursor: pointer;
    z-index: 10;
  }
  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .panel h2 { font-size: 19px; margin-bottom: 4px; }
  .panel .hint { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 6px; }
  input[type=text], input[type=url] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
  }
  .file-drop {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 22px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
  }
  .file-drop:hover { border-color: var(--rose); color: var(--rose); }
  input[type=file] { display: none; }
  .thumbs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px;
  }
  .thumb { position: relative; width: 64px; height: 64px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .thumb button {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; background: var(--ink); color: var(--paper);
    font-size: 12px; cursor: pointer; line-height: 1;
  }
  .primary-btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: var(--charcoal-deep);
    color: var(--gold-soft);
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }
  .ghost-btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .status-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--ink-soft); margin-top: 4px;
  }
  .meter { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--gold); }
  .qr-box {
    text-align: center;
    padding-top: 6px;
  }
  .qr-box #qr-canvas { display: inline-block; margin: 10px auto; }
  .link-row {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .link-row input {
    flex: 1;
  }
  .link-row button {
    padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 60;
  }
  .toast.show { opacity: 1; }
</style>
</head>

  function fmtHMS(ms) {
    if (ms <= 0) return '0ч 0мин';
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h + 'ч ' + m + 'мин';
  }

  function igUrl() {
    let v = (state.instagram || '').trim();
    if (!v) return '';
    if (v.startsWith('http')) return v;
    v = v.replace(/^@/, '');
    return 'https://instagram.com/' + v;
  }

  function bytesOf(str) { return new Blob([str]).size; }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  function expiresAt() {
    if (!state.createdAt) return null;
    return state.createdAt + state.expiryHours * 3600000;
  }

  function isExpired() {
    const exp = expiresAt();
    return exp !== null && Date.now() > exp;
  }

  // ---------------- GUEST VIEW ----------------
  function renderGuest() {
    const exp = expiresAt();
    const expired = isExpired();
    const ig = igUrl();

    if (!state.createdAt || state.photos.length === 0) {
      app.innerHTML = `
        <div class="wrap">
          <img class="brand-logo" src="${LOGO_SRC}" alt="TD Production">
          <div class="empty-state">
            <h3 style="margin-bottom:8px;">Албумот сè уште се подготвува</h3>
            <p style="margin:0;">Фотографот наскоро ќе ги додаде фотографиите. Освежи ја страницата подоцна.</p>
          </div>
          ${ig ? followBarHTML(ig) : ''}
          ${brandFooterHTML()}
        </div>`;
      return;
    }

    if (expired) {
      app.innerHTML = `
        <div class="wrap">
          <img class="brand-logo" src="${LOGO_SRC}" alt="TD Production">
          <div class="expired">
            <h1>Албумот истече</h1>
            <p>Овој албум беше достапен ${state.expiryHours} часа по објавувањето. ${state.title ? 'Ви благодариме што бевте дел од ' + escapeHtml(state.title) + '!' : 'Ви благодариме!'}</p>
          </div>
          ${ig ? followBarHTML(ig) : ''}
          ${brandFooterHTML()}
        </div>`;
      return;
    }

    const remaining = exp - Date.now();
    app.innerHTML = `
      <div class="wrap">
        <div class="hero">
          <img class="brand-logo" src="${LOGO_SRC}" alt="TD Production">
          <h1>${state.title ? escapeHtml(state.title) : 'Нашата свадба'}</h1>
          <div class="sub">Споделено со тебе преку QR код</div>
          <div class="countdown"><span class="dot"></span>Достапно уште <strong id="live-countdown">${fmtHMS(remaining)}</strong></div>
        </div>
        <div class="gallery">
          ${state.photos.map(p => `<img src="${p.src}" loading="lazy" data-full="${p.src}">`).join('')}
        </div>
        ${ig ? followBarHTML(ig) : ''}
        ${brandFooterHTML()}
      </div>`;

    app.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => openLightbox(img.dataset.full));
    });

    clearInterval(window.__cd);
    window.__cd = setInterval(() => {
      const r = expiresAt() - Date.now();
      const el = document.getElementById('live-countdown');
      if (!el) { clearInterval(window.__cd); return; }
      if (r <= 0) { renderGuest(); return; }
      el.textContent = fmtHMS(r);
    }, 30000);
  }

  function brandFooterHTML() {
    return `<div class="brand-footer">Фотографирано и уредено од <strong>TD Production</strong></div>`;
  }

  function followBarHTML(ig) {
    return `
      <div class="follow-bar">
        <a class="follow-btn" href="${ig}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
          Следи нè на Instagram
        </a>
      </div>`;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- ADMIN VIEW ----------------

    app.innerHTML = `
      <div class="wrap">
        <div class="hero" style="padding-top:14px;">
          <img class="brand-logo" style="width:64px;" src="${LOGO_SRC}" alt="TD Production">

        <div class="panel">
          <h2>Детали за собитието</h2>

  function escapeAttr(s) { return (s||'').replace(/"/g, '&quot;'); }

      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    toast('Се компресираат ' + files.length + ' фотографии…');
    for (const f of files) {
      try {
        const src = await compressImage(f, 1500, 0.68);
        state.photos.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2,7), src });
      } catch(err) { /* skip failed file */ }
    }
    e.target.value = '';
    DATA_EL.textContent = JSON.stringify(state);
    renderAdmin();
    toast('Додадено');
  }

  function downloadUpdatedFile() {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('index.html симнат — прикачи го на хостингот за да оди во живо');
  }

  async function doPublish() {
    if (publishing) return;
    publishing = true;
    const btn = document.getElementById('publish-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Се објавува…'; }

    state.title = (document.getElementById('f-title').value || '').trim();
    state.instagram = (document.getElementById('f-ig').value || '').trim();
    if (!state.createdAt && state.photos.length > 0) {
      state.createdAt = Date.now();
    }
    DATA_EL.textContent = JSON.stringify(state);

    try {
      if (typeof claude !== 'undefined' && claude && claude.use) {
        const artifact = await claude.use('artifact');
        if (artifact) {
          await artifact.publish('<!DOCTYPE html>\n' + document.documentElement.outerHTML);
          toast('Албумот е објавен');
        } else {
          downloadUpdatedFile();
        }
      } else {
        downloadUpdatedFile();
      }
    } catch (err) {
      downloadUpdatedFile();
    }
    publishing = false;
    renderAdmin();
  }

  async function doReset() {
    if (!confirm('Ова ќе го избрише тековниот албум и ќе почне нов 12-часовен период. Продолжи?')) return;
    state = { title: '', instagram: state.instagram, createdAt: null, expiryHours: 12, photos: [] };
    DATA_EL.textContent = JSON.stringify(state);
    renderAdmin();
    try {
      const artifact = await claude.use('artifact');
      if (artifact) await artifact.publish('<!DOCTYPE html>\n' + document.documentElement.outerHTML);
    } catch(e) {}
  }

  // ---------------- BOOT ----------------
  async function boot() {
    app.innerHTML = '<div class="wrap"><div class="empty-state">Се вчитува…</div></div>';
    try {
      if (window.claude && window.claude.use) {
        const user = await window.claude.use('user');
        isOwner = !!(user && user.isOwner && user.isOwner());
      }
    } catch(e) { isOwner = false; }
    ownerChecked = true;
    isOwner ? renderAdmin() : renderGuest();
  }

  boot();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
