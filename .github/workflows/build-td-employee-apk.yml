name: Build TD Employee Notifications APK
on:
  push:
    branches: [main]
    paths:
      - 'android-td-employee/**'
      - 'employee/index.html'
      - '.github/workflows/build-td-employee-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy TD Employee web app into APK
        run: |
          mkdir -p android-td-employee/employee/src/main/assets
          cp employee/index.html android-td-employee/employee/src/main/assets/index.html
      - name: Build release APK
        working-directory: android-td-employee
        run: gradle :employee:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TD-Employee-v1.1-notifications-unsigned
          path: android-td-employee/employee/build/outputs/apk/release/*.apk
